<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPER GYM - Bookings</title>
<link rel="icon" href="img/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet">

<body data-page="bookings">
<header id="top"></header>
<main>
<h1>Bookings</h1><p class="sub" id="subtitle"></p>
<section class="card"><h2>New booking</h2>
<form id="form" novalidate>

<label>Class session<select name="sessionId" id="session"></select><span class="err"></span></label>
<button class="full">Book class</button>
</form></section>
<section class="card"><h2>Bookings</h2><div class="tw"><table><thead><tr><th>Member</th><th>Class</th><th>When</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<div id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
