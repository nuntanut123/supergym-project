<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>SUPER GYM - Login</title>

    <link rel="icon" href="img/icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="index">

    <main class="pick login-page">

        <!-- SuperGym Logo -->
        <img src="img/logo.png"
             alt="Super Gym Fitness Club">

        <h1>Welcome Back!</h1>

        <p class="sub">
            Log in to your SuperGym account
        </p>

        <!-- Login Form -->
        <form id="loginForm" class="login-form">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="full">
                Log In
            </button>

            <p id="loginError"
               class="login-error"
               role="alert"
               hidden></p>

            <p class="auth-switch">New to SuperGym? <a href="signup.html">Sign Up</a></p>
        </form>

    </main>

    <div id="toast"></div>

    <script src="js/app.js"></script>

</body>
</html>
